specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Balancer
providerId: balancer
created: '2026-05-08'
modified: '2026-05-08'
reconciled: true
tags:
  - DeFi
  - DEX
  - Plans
description: >-
  Balancer is a decentralized protocol; the public GraphQL API and subgraphs are free and
  unauthenticated. There is no commercial subscription. Cost to use Balancer at scale is on-chain
  gas plus pool swap fee (set per pool by the pool creator) and yield protocol cut.
sources:
  - https://docs.balancer.fi/
  - https://github.com/balancer/api
plans:
  - id: balancer-public-api
    name: Public GraphQL API (Free)
    type: open
    description: Free, unauthenticated GraphQL API used by the Balancer UI and third parties.
    entries:
      - label: Subscription
        name: public_subscription
        type: subscription
        metric: month
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: No authentication
      - name: Fair-use rate limit
  - id: balancer-onchain
    name: On-chain (gas + swap fee)
    type: usage
    description: Smart-contract usage charges the user on-chain gas, pool swap fee, and protocol cut.
    entries:
      - label: Pool swap fee (set per pool)
        name: swap_fee
        type: usage
        metric: trade
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: typically 0.01% to 1% (set by pool creator)
        userMultiplied: false
    elements:
      - name: Gas paid in chain native asset
      - name: Protocol cut captured by veBAL
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
