specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Balancer
providerId: balancer
created: '2026-05-08'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-08, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-08'
reconciled: false
tags:
  - DeFi
  - DEX
  - Rate Limiting
description: >-
  Balancer's public GraphQL API at api-v3.balancer.fi is operated on a fair-use basis without
  published per-key limits. The Graph subgraphs follow The Graph Network's per-key plan rate
  limits if accessed through a Studio key. Soft fair-use is around 10 queries per second per IP
  for the public API.
notes: Balancer does not publish a contractual rate limit; subgraph access via The Graph
  Network has its own pricing and limits.
sources:
  - https://docs.balancer.fi/
  - https://thegraph.com/docs/en/billing/
responseCodes:
  throttled: 429
limits:
  - name: Public GraphQL API (fair use)
    scope: ip
    metric: requests_per_second
    limit: 10
  - name: Subgraph (via The Graph)
    scope: api_key
    metric: requests_per_second
    limit: -1
    notes: Subject to The Graph Network plan limits.
policies:
  - name: Caching
    description: Cache GraphQL responses; pool data updates on a periodic cadence, not per-block for analytics.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
