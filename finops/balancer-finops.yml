description: >-
  FinOps view of Balancer. There is no SaaS bill. Cost is on-chain gas (chain native token), the
  per-pool swap fee, and the protocol cut. FinOps allocation is by wallet and contract
  interaction; subgraph access via The Graph Network is a separate cost line if used.
