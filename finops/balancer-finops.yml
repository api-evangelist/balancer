serviceCategory: DeFi Protocol
billingModel:
  pricingCategory: On-chain Usage Fee
  billingFrequency: Per Transaction
  billingCurrency: Native Chain Asset
  chargeCategories:
    - Usage
focusColumns:
  ServiceName: Balancer Vault and Pools
  ServiceCategory: DeFi Protocol
  ProviderName: Balancer DAO
  PublisherName: Balancer DAO
  InvoiceIssuerName: On-chain
  BillingCurrency: Native Asset
  ChargeCategory: Usage
meters:
  - name: gas
    description: Native-asset gas cost per swap or LP operation.
    unit: gas
    aggregation: sum
    dimensions:
      - wallet
      - chain
      - pool
  - name: pool_swap_fee
    description: Per-pool swap fee (set by pool creator).
    unit: percent_of_notional
    aggregation: sum
    dimensions:
      - wallet
      - pool
  - name: subgraph_credits
    description: Optional cost of Subgraph queries via The Graph Network.
    unit: credit
    aggregation: sum
    dimensions:
      - api_key
principles:
  - name: Visibility
    description: Pull on-chain swap events into FinOps store; tag by wallet and pool.
  - name: Allocation
    description: Allocate gas and swap fees to consuming desk by wallet.
  - name: Optimization
    description: Use SOR to find lowest-fee route; choose pools with lower swap fee where appropriate.
  - name: Accountability
    description: Assign a wallet owner per executing strategy; reconcile monthly.
